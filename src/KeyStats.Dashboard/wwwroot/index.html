<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeyStats</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/states.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/overview.css">
  <link rel="stylesheet" href="css/speed.css">
  <link rel="stylesheet" href="css/typos.css">
  <link rel="stylesheet" href="css/keyboard.css">
  <link rel="stylesheet" href="css/letters.css">
  <link rel="stylesheet" href="css/rhythm.css">
  <link rel="stylesheet" href="css/activity.css">
  <link rel="stylesheet" href="css/activity-day.css">
  <link rel="stylesheet" href="css/shortcuts.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/settings-live.css">
  <link rel="stylesheet" href="css/settings-key.css">
  <link rel="stylesheet" href="css/settings-backup.css">
  <link rel="stylesheet" href="css/settings-export.css">
  <link rel="stylesheet" href="css/settings-recompute.css">
  <link rel="stylesheet" href="css/unlock.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Navigation principale">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect class="brand-tile" x="1" y="1" width="28" height="28" rx="8"/><path d="M8 11h0M12 11h0M16 11h0M20 11h0M8 15h0M12 15h0M16 15h0M20 15h0M9 20h12" class="brand-keys" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span>Statistiques<br>de frappe</span>
      </div>
      <span class="nav-group">Synthèse</span>
      <a href="#/ensemble" data-page="ensemble"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>Vue d'ensemble</a>
      <span class="nav-group">Analyse</span>
      <a href="#/vitesse" data-page="vitesse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4.5-5"/></svg>Vitesse</a>
      <a href="#/fautes" data-page="fautes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>Fautes</a>
      <a href="#/clavier" data-page="clavier"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h0M10 10h0M13.5 10h0M17 10h0M7.5 14h9"/></svg>Clavier</a>
      <a href="#/rythme" data-page="rythme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></svg>Rythme</a>
      <a href="#/lettres" data-page="lettres"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18l4-12 4 12M5 14h5"/><path d="M14.5 18v-4.5a2.75 2.75 0 0 1 5.5 0V18M14.5 15h5.5"/></svg>Lettres et mots</a>
      <a href="#/raccourcis" data-page="raccourcis"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="8" width="8" height="8" rx="1.8"/><rect x="13.5" y="8" width="8" height="8" rx="1.8"/><path d="M12 10.5v3M10.5 12h3"/></svg>Raccourcis</a>
      <span class="nav-group">Origine</span>
      <a href="#/activite" data-page="activite"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Activité et origine</a>
      <a href="#/detail" data-page="detail"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 2M10 2.5h4"/></svg><span class="grow">Détail à la ms</span><svg class="small" viewBox="0 0 24 24" role="img" aria-label="Demande le déverrouillage"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></a>
      <div class="grow"></div>
      <div class="nav-rule"></div>
      <a href="#/reglages" data-page="reglages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M19 6h1M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="16" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg>Réglages</a>
    </nav>

    <main class="main">
      <header class="header">
        <div class="header-top">
          <div class="title">
            <h1 id="page-title"></h1>
            <p id="page-description"></p>
          </div>
          <div class="pills" role="status" aria-label="État de l'agent et des données">
            <span id="agent-on" class="pill pill-ok" hidden><span class="dot"></span>Agent actif</span>
            <span id="agent-off" class="pill pill-bad" hidden><span class="dot"></span>Agent arrêté</span>
            <span class="pill-sep" aria-hidden="true"></span>
            <span id="key-locked" class="pill pill-muted" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Données verrouillées</span>
            <button id="unlock-open" class="btn btn-sm btn-primary" type="button" hidden>Déverrouiller</button>
            <span id="key-open" class="pill pill-info" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>Données déverrouillées</span>
            <button id="key-lock" class="btn btn-sm btn-dark" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Verrouiller</button>
          </div>
        </div>
        <div id="filters" class="filters" role="group" aria-label="Filtres globaux" hidden>
          <div class="field"><span class="label" id="l-period">Période</span><div class="seg" data-filter="period" role="group" aria-labelledby="l-period"></div></div>
          <label class="field"><span class="label">Application</span><select id="f-app"></select></label>
          <div class="field"><span class="label" id="l-kind">Contenu</span><div class="seg" data-filter="kind" role="group" aria-labelledby="l-kind"></div></div>
          <div class="field" id="device-field"><span class="label" id="l-device">Clavier</span><div class="seg" data-filter="device" role="group" aria-labelledby="l-device"></div></div>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <dialog id="unlock-dialog" class="dialog" aria-labelledby="unlock-title">
    <span id="unlock-icon" class="dialog-icon">
      <svg id="unlock-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span id="unlock-spin" class="spinner" aria-hidden="true"></span>
    </span>
    <div id="unlock-status" role="status">
      <h2 id="unlock-title"></h2>
      <p id="unlock-text"></p>
    </div>
    <div id="unlock-alert" class="alert" role="alert" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.5h0"/></svg>
      <span id="unlock-alert-text"></span>
    </div>
    <form id="unlock-phrase" class="phrase" hidden>
      <label for="unlock-input">Saisissez votre phrase de secours</label>
      <span class="phrase-row">
        <input id="unlock-input" type="password" autocomplete="off" spellcheck="false" aria-describedby="unlock-error">
        <button id="unlock-eye" class="icon-btn" type="button" aria-label="Afficher la phrase" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </span>
      <span id="unlock-error" class="field-error" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.5h0"/></svg><span id="unlock-error-text"></span></span>
    </form>
    <button id="unlock-main" class="btn btn-primary btn-lg" type="button"><svg id="unlock-face" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M9 10h0M15 10h0M9.5 15a3.5 3.5 0 0 0 5 0"/></svg><span id="unlock-main-text"></span></button>
    <div class="dialog-foot">
      <button id="unlock-switch" class="link-btn" type="button"></button>
      <button id="unlock-cancel" class="btn btn-sm" type="button">Annuler</button>
    </div>
  </dialog>
</body>
</html>
