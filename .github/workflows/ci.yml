name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; default-branch runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-size:
    name: PR size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: At most 400 changed lines, unless labelled large-pr
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          LARGE: ${{ contains(github.event.pull_request.labels.*.name, 'large-pr') }}
        run: |
          total=$((ADDITIONS + DELETIONS))
          echo "Changed lines: $total"
          if [ "$total" -gt 400 ] && [ "$LARGE" != "true" ]; then
            echo "::error::$total changed lines, over the 400-line cap. Split the PR, or add the large-pr label with a written justification."
            exit 1
          fi

  build:
    name: Format, build, test
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore KeyStats.slnx

      - name: Format check
        run: dotnet format KeyStats.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build KeyStats.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --project tests/KeyStats.Core.Tests -c Release --no-build
